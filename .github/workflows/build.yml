name: Build jqe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-avx2
            os: windows-latest
            exe: jqe.exe
          - name: linux-x64-avx2
            os: ubuntu-latest
            exe: jqe
          - name: macos-arm64
            os: macos-latest
            exe: jqe
          - name: android-arm64
            os: ubuntu-latest
            exe: jqe

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S engine -B engine/build -G Ninja -DJQE_NATIVE=OFF -DCMAKE_CXX_FLAGS="-mavx2 -mfma"
          cmake --build engine/build --target jqe

      - name: Configure and build (Linux)
        if: matrix.name == 'linux-x64-avx2'
        run: |
          cmake -S engine -B engine/build -DJQE_NATIVE=OFF -DCMAKE_CXX_FLAGS="-mavx2 -mfma" \
                -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build engine/build --target jqe -j4

      - name: Configure and build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S engine -B engine/build -DJQE_NATIVE=OFF
          cmake --build engine/build --target jqe -j4

      - name: Configure and build (Android)
        if: matrix.name == 'android-arm64'
        run: |
          cmake -S engine -B engine/build -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DJQE_NATIVE=OFF
          cmake --build engine/build --target jqe

      - name: Smoke test
        if: matrix.name != 'android-arm64'
        shell: bash
        run: ./engine/build/${{ matrix.exe }} perft 3 | grep -q 83907

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/jqe-${{ matrix.name }}
          cp engine/build/${{ matrix.exe }} engine/nets/it014.jqn LICENSE dist/jqe-${{ matrix.name }}/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a jqe-${{ matrix.name }}.zip jqe-${{ matrix.name }}
          else
            zip -r jqe-${{ matrix.name }}.zip jqe-${{ matrix.name }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jqe-${{ matrix.name }}
          path: dist/jqe-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
